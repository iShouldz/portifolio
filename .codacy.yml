---
exclude_paths:
  - "src/components/ui/**"
  - "dist/**"
  - "node_modules/**"
  - "public/**"
  - "coverage/**"
  - "*.config.js"
  - "*.config.ts"
  - ".eslintrc.*"
  - "eslint.config.*"
  - "src/**/*.css"

engines:
  eslint:
    enabled: true
  remark-lint:
    enabled: false
  stylelint:
    enabled: false