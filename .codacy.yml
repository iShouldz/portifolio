---
exclude_paths:
  - "src/components/ui/**"
  - "dist/**"
  - "node_modules/**"
  - "public/**"
  - "coverage/**"
  - "*.config.js"
  - "*.config.ts"
  - ".eslintrc.*"
  - "eslint.config.*"
  - "src/**/*.css"
  - "src/index.css"
  - "package-lock.json"
  - "package.json"
  - "src/**/*.test.tsx"
  - "src/i18n.ts"

engines:
  eslint:
    enabled: true
  remark-lint:
    enabled: false
  stylelint:
    enabled: false